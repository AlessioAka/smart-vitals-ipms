{% extends "base.html" %}
{% block title %}{{ code }} · Smart Vitals{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:40px auto">
  <p class="tiny" style="margin:0">Error {{ code }}</p>
  <h1 style="margin:4px 0 8px">{{ title }}</h1>
  <p>{{ message }}</p>
  <p style="margin-bottom:0"><a class="btn" href="{{ url_for('dashboard.index') }}">Back to my patients</a></p>
</div>
{% endblock %}
